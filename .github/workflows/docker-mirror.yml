name: Mirror Docker Hub image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version (for example 1.4.2) or edge'
        required: true
        type: string
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN:
        required: true
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-hub-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'ohne-b/twitch-drops-miner' && github.ref == 'refs/heads/main'
    environment: prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm --prefix frontend ci
      - name: Mirror the published image without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          command -v skopeo || { sudo apt-get update; sudo apt-get install -y --no-install-recommends skopeo; }
          node .github/scripts/mirror-image.mjs "$VERSION"
