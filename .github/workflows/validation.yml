name: validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Validation scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --ignore-scripts
      - name: Select checks
        id: scope
        run: |
          node --test .github/scripts/test/validation-scope.test.mjs
          node .github/scripts/validation-scope.mjs >> "$GITHUB_OUTPUT"
          git diff --check HEAD^ HEAD

  dashboard:
    name: Dashboard
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and check dashboard
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run format:check
          npm --prefix frontend test
          npm --prefix frontend run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-assets
          path: web/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  test:
    name: Rust and Dashboard Tests
    needs: [scope, dashboard]
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
      - run: npm --prefix frontend ci
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-assets
          path: web/
      - name: Check Rust and repository automation
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-targets --all-features --locked
          node --test .github/scripts/test/*.test.mjs
          node .github/scripts/release.mjs read
          node .github/scripts/release.mjs artifacts "$(node .github/scripts/release.mjs read)"
          git diff --exit-code
      - name: Build the browser fixture once
        run: |
          cargo build --locked --features dashboard-fixture --bin dashboard-fixture
          strip target/debug/dashboard-fixture
          tar -czf "$RUNNER_TEMP/dashboard-fixture.tar.gz" -C target/debug dashboard-fixture -C "$GITHUB_WORKSPACE" web
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-fixture
          path: ${{ runner.temp }}/dashboard-fixture.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

  browser:
    name: Browser and Accessibility (${{ matrix.shard }}/2)
    needs: [scope, test]
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-fixture
          path: ${{ runner.temp }}
      - name: Prepare the browser fixture
        run: |
          tar -xzf "$RUNNER_TEMP/dashboard-fixture.tar.gz"
          npm --prefix frontend ci
      - name: Browser and accessibility tests
        working-directory: frontend
        env:
          PLAYWRIGHT_PREBUILT_FIXTURE: '1'
        run: |
          npx playwright install --with-deps --only-shell chromium
          npm run test:browser -- --fully-parallel --shard=${{ matrix.shard }}/2
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 7

  docker:
    name: Docker Build (${{ matrix.arch }})
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - name: Prepare image tools and version
        id: image
        run: |
          command -v skopeo || { sudo apt-get update; sudo apt-get install -y --no-install-recommends skopeo; }
          echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          tags: twitch-drops-miner:test
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          provenance: false
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=miner-${{ matrix.arch }}
          cache-to: type=gha,scope=miner-${{ matrix.arch }},mode=max
      - name: Load the exported image for testing
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          skopeo --override-arch "$ARCH" copy "oci-archive:$RUNNER_TEMP/image.tar" docker-daemon:twitch-drops-miner:test
          config=$(skopeo inspect --raw "oci-archive:$RUNNER_TEMP/image.tar" | jq -r .config.digest)
          test "$(docker image inspect --format '{{.Id}}' twitch-drops-miner:test)" = "$config"
      - name: Check runtime, ownership and health without network access
        env:
          PLATFORM: linux/${{ matrix.arch }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          test "$(docker run --rm --platform "$PLATFORM" --network none twitch-drops-miner:test --version)" = "twitch-drops-miner $VERSION"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}' twitch-drops-miner:test)" = "PolyForm-Noncommercial-1.0.0"
          docker run --rm --platform "$PLATFORM" --network none --entrypoint sh twitch-drops-miner:test -ec '
            test "$(id -u):$(id -g)" = "1000:1000"
            test -r /usr/share/licenses/twitch-drops-miner/LICENSE.md
            test -r /usr/share/licenses/twitch-drops-miner/NOTICE.md
            grep -Fxq "Required Notice: Copyright (c) 2026 ohne-b (OhneB)" /usr/share/licenses/twitch-drops-miner/LICENSE.md
            grep -Fxq "# PolyForm Noncommercial License 1.0.0" /usr/share/licenses/twitch-drops-miner/LICENSE.md
            grep -Fq "Copyright (c) 2024 DevilXD" /usr/share/licenses/twitch-drops-miner/NOTICE.md
            test -r /usr/share/licenses/twitch-drops-miner/dashboard/manrope.txt
            test ! -e /app/src
            ! command -v python
            ! command -v node
          '
          container=$(docker run -d --platform "$PLATFORM" --network none --read-only \
            --tmpfs /app/data:uid=1000,gid=1000 --tmpfs /app/logs:uid=1000,gid=1000 twitch-drops-miner:test)
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          for attempt in $(seq 1 20); do
            if docker exec "$container" /usr/local/bin/twitch-drops-miner healthcheck; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Retain the tested image for publishing
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: [scope, dashboard]
    if: needs.scope.outputs.full == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-universal
            runner: macos-15
            target: universal-apple-darwin
            bundles: app,dmg
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          if [ '${{ runner.os }}' = macOS ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
          key: desktop-${{ matrix.platform }}
      - run: npm --prefix frontend ci
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-assets
          path: web/
      - name: Check native code
        run: |
          cargo clippy -p twitch-drops-miner-desktop --all-targets --all-features --locked -- -D warnings
          cargo test -p twitch-drops-miner-desktop --all-targets --all-features --locked
      - name: Build offline native fixture
        working-directory: desktop
        run: node ../frontend/node_modules/@tauri-apps/cli/tauri.js build --debug --no-bundle --no-sign --features desktop-fixture --config tauri.fixture.conf.json -- --locked
      - name: Exercise the native window without Twitch
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          if [ '${{ runner.os }}' = Linux ]; then
            xvfb-run -a node .github/scripts/native-smoke.mjs
          else
            node .github/scripts/native-smoke.mjs
          fi
      - name: Build production installers once
        working-directory: desktop
        env:
          NO_STRIP: 'true'
        run: |
          if [ '${{ runner.os }}' = macOS ]; then
            # Ad-hoc sign the app before packaging; updater signing belongs to publication.
            node ../frontend/node_modules/@tauri-apps/cli/tauri.js build --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
            bundle='../target/${{ matrix.target }}/release/bundle/macos'
            COPYFILE_DISABLE=1 tar -czf "$bundle/Drops Miner.app.tar.gz" -C "$bundle" 'Drops Miner.app'
          else
            node ../frontend/node_modules/@tauri-apps/cli/tauri.js build --no-sign --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' -- --locked
          fi
      - name: Collect versioned desktop artifacts
        run: |
          binary='target/${{ matrix.target }}/release/twitch-drops-miner-desktop'
          if [ '${{ runner.os }}' = macOS ]; then
            unpacked=$(mktemp -d)
            tar -xzf 'target/${{ matrix.target }}/release/bundle/macos/Drops Miner.app.tar.gz' -C "$unpacked"
            app="$unpacked/Drops Miner.app"
            binary="$app/Contents/MacOS/twitch-drops-miner-desktop"
            lipo "$binary" -verify_arch x86_64 arm64
            codesign --verify --deep --strict "$app"
            test -r "$app/Contents/Resources/LICENSE.md"
            test -r "$app/Contents/Resources/NOTICE.md"
          fi
          node .github/scripts/native-smoke.mjs "$binary"
          node .github/scripts/desktop-artifacts.mjs pack '${{ matrix.platform }}' 'target/${{ matrix.target }}/release/bundle' 'dist/desktop'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/desktop/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  complete:
    name: Validation
    if: always()
    needs: [scope, dashboard, test, browser, docker, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          FULL: ${{ needs.scope.outputs.full }}
          DASHBOARD_RESULT: ${{ needs.dashboard.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$FULL" = false ]; then
            test "$DASHBOARD_RESULT" = skipped
            test "$DESKTOP_RESULT" = skipped
            test "$TEST_RESULT" = skipped
            test "$BROWSER_RESULT" = skipped
            test "$DOCKER_RESULT" = skipped
            echo 'Documentation or verified release metadata only: code and image checks are not needed on this PR.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FULL" = true ]; then
            test "$DASHBOARD_RESULT" = success
            test "$DESKTOP_RESULT" = success
            test "$TEST_RESULT" = success
            test "$BROWSER_RESULT" = success
            test "$DOCKER_RESULT" = success
          else
            exit 1
          fi
