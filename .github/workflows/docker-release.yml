name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already merged and validated on main'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify release publisher
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_OWNER: ${{ github.repository_owner }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Set RELEASE_TOKEN in the prod environment before publishing.' >&2; exit 1; }
          publisher=$(gh api user --jq .login)
          test "$publisher" = "$RELEASE_OWNER" || { echo 'RELEASE_TOKEN must belong to the repository owner.' >&2; exit 1; }
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: rustup show
      - run: npm --prefix frontend ci
      - name: Verify reviewed version and prepare release metadata
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/release.mjs verify "$RELEASE_VERSION"
          remote_tag=$(git ls-remote origin "refs/tags/v${RELEASE_VERSION}")
          test -z "$remote_tag"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            node .github/scripts/release.mjs images "$RELEASE_VERSION"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "prerelease=$(node .github/scripts/release.mjs prerelease "$RELEASE_VERSION")" >> "$GITHUB_OUTPUT"
          node .github/scripts/release.mjs artifacts "$RELEASE_VERSION"
      - name: Prepare the validated desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          node .github/scripts/desktop-artifacts.mjs prepare "$RELEASE_VERSION"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Publish the validated images
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_TAGS: ${{ steps.release.outputs.tags }}
        run: |
          command -v skopeo || { sudo apt-get update; sudo apt-get install -y --no-install-recommends skopeo; }
          node .github/scripts/publish-images.mjs "$RELEASE_VERSION" "$IMAGE_TAGS"
      - name: Publish release with manifest and reviewed notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_TAGS: ${{ steps.release.outputs.tags }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          # Upload the complete set to a draft, then verify it before publication.
          mapfile -t assets < dist/release/assets.txt
          gh release create "v${RELEASE_VERSION}" --target "$GITHUB_SHA" --draft \
            --title "Twitch Drops Miner v${RELEASE_VERSION}" --notes-file dist/release/notes.md \
            "${assets[@]}"
          gh release download "v${RELEASE_VERSION}" --dir dist/verify
          cmp dist/release/SHA256SUMS dist/verify/SHA256SUMS
          (cd dist/verify && sha256sum --strict -c SHA256SUMS)
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "v${RELEASE_VERSION}" --draft=false --prerelease --latest=false
          else
            gh release edit "v${RELEASE_VERSION}" --draft=false --latest
            # Never advertise a stable image before its release and manifest are public.
            docker buildx imagetools create --tag "${IMAGE_TAGS%:*}:latest" "$IMAGE_TAGS"
          fi

  mirror:
    needs: publish
    uses: ./.github/workflows/docker-mirror.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      version: ${{ inputs.version }}
