name: Publish edge image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-edge
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: rustup show
      - run: npm --prefix frontend ci
      - name: Read the image version
        id: image
        run: |
          echo "version=$(node .github/scripts/release.mjs read)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Publish the validated images
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          command -v skopeo || { sudo apt-get update; sudo apt-get install -y --no-install-recommends skopeo; }
          node .github/scripts/publish-images.mjs "$VERSION" ghcr.io/ohne-b/twitch-drops-miner:edge

  mirror:
    needs: publish
    uses: ./.github/workflows/docker-mirror.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      version: edge
